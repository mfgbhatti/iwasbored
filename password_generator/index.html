<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator &middot; mfgbhatti</title>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../assets/js/theme.js"></script>
    <!-- Icons -->
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="../assets/img/apple-touch-icon-144-precomposed.png"
    />
    <link rel="shortcut icon" href="../assets/img/favicon.ico" />
  </head>
  <body>
    <main class="page">
      <div class="site-bar">
        <a class="back" href="../">&larr; projects</a>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <header class="page-head">
        <h1>password generator</h1>
        <p>you need a strong password all the time.</p>
      </header>

      <div class="card stack">
        <div class="row password-row">
          <input
            type="text"
            class="password-display input input--mono"
            id="passwordDisplay"
            placeholder="Click Generate to create a password"
            readonly
          />
          <button class="copy-btn btn btn--icon" id="copyBtn" type="button" title="Copy to clipboard" aria-label="Copy to clipboard">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          </button>
          <button class="btn btn--icon" id="refreshBtn" type="button" title="Generate new password" aria-label="Generate new password">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11A8 8 0 0 0 6 6L4 8M4 4v4h4M4 13a8 8 0 0 0 14 5l2-2M20 20v-4h-4"/></svg>
          </button>
        </div>

        <div class="strength-indicator">
          <span class="hint">Strength</span>
          <div class="strength-bar">
            <div class="strength-bar-fill" id="strengthFill"></div>
          </div>
          <span class="strength-text" id="strengthText">Weak</span>
        </div>
      </div>

      <div class="card stack">
        <div class="field">
          <div class="label">
            <span>Length</span>
            <span id="lengthDisplay" class="num">16</span>
          </div>
          <input type="range" id="lengthSlider" min="4" max="64" value="16" aria-label="Length" />
        </div>

        <div class="field">
          <div class="label"><span>Character types</span></div>
          <div class="grid-2">
            <label class="check checkbox-item">
              <input type="checkbox" id="uppercase" checked />
              <span>A-Z <span class="hint">Uppercase</span></span>
            </label>
            <label class="check checkbox-item">
              <input type="checkbox" id="lowercase" checked />
              <span>a-z <span class="hint">Lowercase</span></span>
            </label>
            <label class="check checkbox-item">
              <input type="checkbox" id="numbers" checked />
              <span>0-9 <span class="hint">Numbers</span></span>
            </label>
            <label class="check checkbox-item">
              <input type="checkbox" id="symbols" checked />
              <span>!@#$ <span class="hint">Symbols</span></span>
            </label>
          </div>
        </div>

        <button class="btn btn--primary btn--block generate-btn" id="generateBtn" type="button">
          Generate Password
        </button>
      </div>
    </main>

    <div class="toast" id="toast" role="status">
      <span class="toast-icon" id="toastIcon" aria-hidden="true">&#10003;</span>
      <span id="toastMessage">Copied to clipboard!</span>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // DOM Elements
        const passwordDisplay = document.getElementById("passwordDisplay");
        const lengthSlider = document.getElementById("lengthSlider");
        const lengthDisplay = document.getElementById("lengthDisplay");
        const strengthFill = document.getElementById("strengthFill");
        const strengthText = document.getElementById("strengthText");
        const generateBtn = document.getElementById("generateBtn");
        const copyBtn = document.getElementById("copyBtn");
        const refreshBtn = document.getElementById("refreshBtn");
        const toast = document.getElementById("toast");
        const toastMessage = document.getElementById("toastMessage");

        const charSets = {
          uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
          lowercase: "abcdefghijklmnopqrstuvwxyz",
          numbers: "0123456789",
          symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?/~`",
        };

        lengthSlider.addEventListener("input", function () {
          lengthDisplay.textContent = this.value;
          generatePassword();
        });

        document
          .querySelectorAll('.checkbox-item input[type="checkbox"]')
          .forEach((checkbox) => {
            checkbox.addEventListener("change", generatePassword);
          });

        generateBtn.addEventListener("click", generatePassword);
        refreshBtn.addEventListener("click", generatePassword);

        copyBtn.addEventListener("click", function () {
          const password = passwordDisplay.value;
          if (!password) {
            showToast("Generate a password first!", false);
            return;
          }

          navigator.clipboard
            .writeText(password)
            .then(() => {
              showToast("Copied to clipboard!", true);
              this.classList.add("copied");
              setTimeout(() => {
                this.classList.remove("copied");
              }, 2000);
            })
            .catch(() => {
              // Fallback
              passwordDisplay.select();
              document.execCommand("copy");
              showToast("Copied to clipboard!", true);
            });
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && document.activeElement === passwordDisplay) {
            generatePassword();
          }
        });

        function generatePassword() {
          const length = parseInt(lengthSlider.value);
          const includeUppercase = document.getElementById("uppercase").checked;
          const includeLowercase = document.getElementById("lowercase").checked;
          const includeNumbers = document.getElementById("numbers").checked;
          const includeSymbols = document.getElementById("symbols").checked;

          if (
            !includeUppercase &&
            !includeLowercase &&
            !includeNumbers &&
            !includeSymbols
          ) {
            showToast("Select at least one character type!", false);
            return;
          }

          let charPool = "";
          if (includeUppercase) charPool += charSets.uppercase;
          if (includeLowercase) charPool += charSets.lowercase;
          if (includeNumbers) charPool += charSets.numbers;
          if (includeSymbols) charPool += charSets.symbols;

          let password = "";
          const poolLength = charPool.length;

          const selectedTypes = [];
          if (includeUppercase) selectedTypes.push(charSets.uppercase);
          if (includeLowercase) selectedTypes.push(charSets.lowercase);
          if (includeNumbers) selectedTypes.push(charSets.numbers);
          if (includeSymbols) selectedTypes.push(charSets.symbols);

          for (let set of selectedTypes) {
            const randomIndex = Math.floor(Math.random() * set.length);
            password += set[randomIndex];
          }

          for (let i = password.length; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * poolLength);
            password += charPool[randomIndex];
          }

          password = password
            .split("")
            .sort(() => Math.random() - 0.5)
            .join("");

          passwordDisplay.value = password;

          updateStrength(password);
        }

        function updateStrength(password) {
          let strength = 0;
          const length = password.length;

          if (length >= 8) strength += 20;
          if (length >= 12) strength += 20;
          if (length >= 16) strength += 20;
          if (length >= 20) strength += 20;

          const hasUpper = /[A-Z]/.test(password);
          const hasLower = /[a-z]/.test(password);
          const hasNumber = /[0-9]/.test(password);
          const hasSymbol = /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?/~`]/.test(password);

          const varietyCount = [
            hasUpper,
            hasLower,
            hasNumber,
            hasSymbol,
          ].filter(Boolean).length;
          strength += varietyCount * 15;

          // Cap at 100
          strength = Math.min(strength, 100);

          // Update UI
          strengthFill.style.width = strength + "%";

          let label = "Weak";
          let color = "var(--danger)";
          if (strength >= 80) {
            label = "Very Strong";
            color = "var(--ok)";
          } else if (strength >= 60) {
            label = "Strong";
            color = "var(--ok)";
          } else if (strength >= 40) {
            label = "Moderate";
            color = "var(--warn)";
          } else if (strength >= 20) {
            label = "Weak";
            color = "var(--danger)";
          }

          strengthFill.style.background = color;
          strengthText.textContent = label;
          strengthText.style.color = color;
        }

        function showToast(message, isSuccess = true) {
          toastMessage.textContent = message;
          toast.className = "toast show";

          document.getElementById("toastIcon").textContent = isSuccess
            ? "\u2713"
            : "!";

          clearTimeout(toast._timeout);
          toast._timeout = setTimeout(() => {
            toast.classList.remove("show");
          }, 3000);
        }

        generatePassword();
      });
    </script>
  </body>
</html>
