<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator &middot; mfgbhatti</title>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../assets/js/theme.js"></script>
    <!-- Icons -->
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="../assets/img/apple-touch-icon-144-precomposed.png"
    />
    <link rel="shortcut icon" href="../assets/img/favicon.ico" />
  </head>
  <body>
    <main class="page">
      <div class="site-bar">
        <a class="back" href="../">&larr; projects</a>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <header class="page-head">
        <h1>calculator</h1>
        <p>a small javascript calculator.</p>
      </header>

      <div class="card stack">
        <input
          type="text"
          class="display readout num"
          id="display"
          disabled
          placeholder="0"
          autofocus
          aria-label="Display"
        />
        <div id="buttons-w" class="buttons-w"></div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const display = document.getElementById("display");
        const buttonsWrapper = document.getElementById("buttons-w");

        const buttons = [
          "C",
          "⌫",
          "÷",
          "π",
          "√",
          "x²",
          "×",
          "7",
          "8",
          "9",
          "-",
          "4",
          "5",
          "6",
          "+",
          "1",
          "2",
          "3",
          "%",
          "0",
          ".",
          "=",
        ];

        const operatorButtons = ["+", "-", "÷", "×"];
        const specialButtons = ["π", "√", "x²", "%", "⌫"];

        buttons.forEach((buttonText) => {
          const button = document.createElement("button");
          button.type = "button";
          button.classList.add("btn");
          button.textContent = buttonText;

          if (buttonText === "0") {
            button.dataset.value = "0";
          }

          if (operatorButtons.includes(buttonText)) {
            button.classList.add("operator");
          }

          if (specialButtons.includes(buttonText)) {
            button.classList.add("special");
          }

          if (buttonText === "=") {
            button.classList.add("equals", "btn--primary");
          } else if (buttonText === "C") {
            button.classList.add("clear");
          }

          button.addEventListener("click", () => {
            button.style.transform = "scale(0.95)";
            setTimeout(() => {
              button.style.transform = "";
            }, 100);

            switch (buttonText) {
              case "=":
                calculate();
                break;
              case "C":
                clearDisplay();
                break;
              case "⌫":
                backSpace();
                break;
              case "√":
                getSquareRoot();
                break;
              case "x²":
                powerByTwo();
                break;
              case "π":
                addPi();
                break;
              default:
                appendToDisplay(buttonText);
            }
          });

          buttonsWrapper.appendChild(button);
        });

        document.addEventListener("keydown", (e) => {
          const key = e.key;

          const keyMap = {
            Enter: "=",
            Backspace: "⌫",
            Escape: "C",
            "*": "×",
            "/": "÷",
            p: "π",
            P: "π",
          };

          let buttonText = keyMap[key] || key;

          const buttons = document.querySelectorAll("#buttons-w button");
          for (let btn of buttons) {
            if (btn.textContent === buttonText) {
              btn.click();
              break;
            }
          }

          if (["Enter", "Backspace", "Escape"].includes(key)) {
            e.preventDefault();
          }
        });

        function appendToDisplay(value) {
          if (value === ".") {
            const parts = display.value.split(/[+\-÷×]/);
            const lastPart = parts[parts.length - 1];
            if (lastPart.includes(".")) return;
          }

          if (
            operatorButtons.includes(value) &&
            operatorButtons.includes(display.value.slice(-1))
          ) {
            return;
          }
          // NOTE: may be review it
          if (
            value === "π" &&
            display.value !== "" &&
            /[\d.]$/.test(display.value)
          ) {
            display.value += "×";
          }

          display.value += value;
          updateDisplayPlaceholder();
        }

        function getSquareRoot() {
          const value = parseFloat(display.value);
          if (isNaN(value) || value < 0) {
            display.value = "Error";
            setTimeout(clearDisplay, 1500);
            return;
          }
          const result = Math.sqrt(value);
          display.value = result % 1 !== 0 ? result.toFixed(4) : String(result);
          updateDisplayPlaceholder();
        }

        function powerByTwo() {
          const value = parseFloat(display.value);
          if (isNaN(value)) {
            display.value = "Error";
            setTimeout(clearDisplay, 1500);
            return;
          }
          const result = value * value;
          display.value = result % 1 !== 0 ? result.toFixed(4) : String(result);
          updateDisplayPlaceholder();
        }

        function addPi() {
          if (display.value === "" || /[\d.]$/.test(display.value)) {
            display.value += "×3.1416";
          } else {
            display.value += "3.1416";
          }
          updateDisplayPlaceholder();
        }

        function backSpace() {
          display.value = display.value.slice(0, -1);
          updateDisplayPlaceholder();
        }

        function clearDisplay() {
          display.value = "";
          updateDisplayPlaceholder();
        }

        function updateDisplayPlaceholder() {
          display.placeholder = display.value === "" ? "0" : "";
        }

        function calculate() {
          try {
            let expression = display.value
              .replace(/×/g, "*")
              .replace(/÷/g, "/")
              .replace(/π/g, "3.1416");

            if (!/^[\d.+\-*/%]+$/.test(expression)) {
              throw new Error("Invalid expression");
            }

            if (expression.includes("/0")) {
              throw new Error("Division by zero");
            }

            const result = new Function(`return (${expression})`)();

            if (!isFinite(result)) {
              throw new Error("Division by zero");
            }

            display.value =
              result % 1 !== 0 ? result.toFixed(4) : String(result);
            updateDisplayPlaceholder();
          } catch (error) {
            display.value = "Error";
            setTimeout(clearDisplay, 1500);
            console.error("Calculation error:", error);
          }
        }
      });
    </script>
  </body>
</html>
