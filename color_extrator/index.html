<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Extractor &middot; mfgbhatti</title>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../assets/js/theme.js"></script>
    <!-- Icons -->
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="../assets/img/apple-touch-icon-144-precomposed.png"
    />
    <link rel="shortcut icon" href="../assets/img/favicon.ico" />
  </head>
  <body>
    <main class="page">
      <div class="site-bar">
        <a class="back" href="../">&larr; projects</a>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <header class="page-head">
        <h1>color extractor</h1>
        <p>upload an image, tap any color to copy its hex code.</p>
      </header>

      <div class="card stack">
        <label class="btn btn--block" id="fileLabel" role="button" tabindex="0">
          <span class="file-icon">📤</span>
          <span>Choose image</span>
          <input type="file" id="upload" accept="image/*" />
        </label>

        <div class="preview-container">
          <img id="preview" alt="uploaded preview" style="display: none" />
        </div>

        <div id="palette">
          <div class="empty-palette">⬆️ upload an image to see colors</div>
        </div>

        <p class="hint">tap a swatch to copy hex code</p>
      </div>

      <div id="toast" class="toast">📋 copied!</div>
      <canvas id="canvas" width="100" height="100"></canvas>
    </main>

  <script>
    (function() {
      const upload = document.getElementById('upload');
      const preview = document.getElementById('preview');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const palette = document.getElementById('palette');
      const toast = document.getElementById('toast');

      let toastTimer = null;

      function showToast(msg = '📋 copied!') {
        toast.textContent = msg;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 1800);
      }

      // Handle file selection
      upload.addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        // check if it's an image
        if (!file.type.startsWith('image/')) {
          showToast('⚠️ please select an image');
          this.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = function (evt) {
          const img = new Image();
          img.onload = function () {
            preview.src = img.src;
            preview.style.display = 'block';
            extractColors(img);
            // reset file input so same file can be re-uploaded
            upload.value = '';
          };
          img.onerror = function () {
            showToast('⚠️ failed to load image');
            upload.value = '';
          };
          img.src = evt.target.result;
        };
        reader.onerror = function () {
          showToast('⚠️ file read error');
          upload.value = '';
        };
        reader.readAsDataURL(file);
      });

      // Also allow drag & drop on the label? We keep it simple but we can add a small extra
      // but the label already covers the input. For better mobile UX, we keep it as is.

      // Extract dominant colors
      function extractColors(img) {
        // Use a fixed small canvas for performance (100px wide, proportional height)
        const w = 100;
        const h = Math.round(100 * (img.height / img.width));
        canvas.width = w;
        canvas.height = h;

        // clear & draw
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        let imageData;
        try {
          imageData = ctx.getImageData(0, 0, w, h);
        } catch (err) {
          showToast('⚠️ canvas error');
          return;
        }

        const data = imageData.data;
        const colorMap = new Map(); // key -> count

        // sample every 2nd pixel for speed (still accurate)
        const step = 2; 
        for (let i = 0; i < data.length; i += step * 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const a = data[i + 3];
          // skip transparent / nearly transparent
          if (a < 128) continue;

          // Quantize: 16-step reduces similar colors (more natural grouping)
          const qR = Math.round(r / 16) * 16;
          const qG = Math.round(g / 16) * 16;
          const qB = Math.round(b / 16) * 16;
          const key = `${qR},${qG},${qB}`;

          colorMap.set(key, (colorMap.get(key) || 0) + 1);
        }

        // If no colors found (e.g., all transparent), fallback
        if (colorMap.size === 0) {
          palette.innerHTML = `<div class="empty-palette">😕 no colors found (try another image)</div>`;
          return;
        }

        // Sort by count descending, take top 8
        const sorted = Array.from(colorMap.entries())
          .sort((a, b) => b[1] - a[1])
          .slice(0, 8);

        // Build palette
        palette.innerHTML = '';
        sorted.forEach(([rgbStr]) => {
          const [r, g, b] = rgbStr.split(',').map(Number);
          const hex = `#${[r, g, b].map(c => c.toString(16).padStart(2, '0')).join('')}`;
          const div = document.createElement('div');
          div.className = 'swatch';
          div.style.background = `rgb(${r},${g},${b})`;
          div.innerHTML = `<span>${hex}</span>`;
          div.setAttribute('role', 'button');
          div.setAttribute('aria-label', `copy ${hex}`);
          div.title = `tap to copy ${hex}`;

          // copy on click / tap
          div.addEventListener('click', function (e) {
            e.stopPropagation();
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(hex).then(() => {
                showToast(`📋 ${hex} copied`);
              }).catch(() => {
                // fallback
                copyFallback(hex);
              });
            } else {
              copyFallback(hex);
            }
          });

          // Also support touch events for extra reliability
          div.addEventListener('touchstart', function (e) {
            // we use click, but this ensures no double-tap zoom interference
          }, { passive: true });

          palette.appendChild(div);
        });

        // add a small "tap to copy" hint if we have colors
        // but we already have footer hint
      }

      // Fallback copy method for older browsers / mobile
      function copyFallback(text) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          textarea.style.top = '-9999px';
          textarea.style.width = '1px';
          textarea.style.height = '1px';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showToast(`📋 ${text} copied`);
        } catch (err) {
          showToast('⚠️ copy not supported');
        }
      }

      // If user clicks on empty palette hint, maybe we can trigger file input?
      // we use the label already.

      // For better accessibility: allow keyboard on label
      const fileLabel = document.getElementById('fileLabel');
      fileLabel.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          upload.click();
        }
      });

      // Reset preview if needed? not required.
      // Also handle case where user cancels file selection
      upload.addEventListener('cancel', function () {
        // do nothing
      });

      // show a small toast if the user clicks on the empty area? no.

      // extra: if image is loaded and we want to re-extract (if user re-upload)
      // everything resets via change event.

      // also add a subtle clear if user wants? not needed.

      console.log('🎨 mobile-friendly color extractor ready');
    })();
  </script>
</body>
</html>
