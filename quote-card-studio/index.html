<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Quote Card Studio &middot; mfgbhatti</title>
    <link
      id="gf"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Dynalight&family=Fleur+De+Leah&family=Instrument+Sans:wght@400;500;600&family=Lora:wght@400&family=Pacifico&family=Parisienne&family=Playfair+Display:ital,wght@1,400&family=Story+Script&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="style.css" />
    <!-- Icons -->
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="../assets/img/apple-touch-icon-144-precomposed.png"
    />
    <link rel="shortcut icon" href="../assets/img/favicon.ico" />
    <script src="../assets/js/theme.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page page--wide">
      <div class="site-bar">
        <a class="back" href="../">&larr; projects</a>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <header class="page-head">
        <h1>quote card studio</h1>
        <p>
          type a quote, choose a typeface and a size, then save the card as a
          png.
        </p>
      </header>

      <div class="layout">
        <!-- PREVIEW + TEXT -->
        <div class="preview">
          <section class="card" aria-label="Card preview">
            <h3 class="card__title">Preview</h3>
            <canvas
              id="card"
              width="1080"
              height="1080"
              role="img"
              aria-label="Quote card preview"
            ></canvas>
            <div class="cols-3">
              <div id="dims" class="sub"></div>
              <button id="copy" class="btn" type="button">Copy image</button>
              <button id="dl" class="btn btn--primary" type="button">
                Download PNG
              </button>
            </div>
            <p id="status" class="msg" role="status" aria-live="polite"></p>
          </section>

          <section class="card">
            <h3 class="card__title"><span class="step badge">1</span> Quote</h3>
            <div class="stack">
              <div class="field">
                <label class="label" for="quote">Quote</label>
                <textarea class="textarea" id="quote" rows="4" maxlength="600"></textarea>
              </div>
              <div class="field">
                <label class="label" for="author">Attribution</label>
                <input
                  class="input"
                  id="author"
                  type="text"
                  maxlength="80"
                  placeholder="Name (optional)"
                />
              </div>
            </div>
          </section>
        </div>

        <!-- SETTINGS -->
        <div>
          <section class="card" aria-label="Card settings">
            <h3 class="card__title"><span class="step badge">2</span> Typeface</h3>
            <div id="fonts" class="fonts" role="group" aria-label="Typeface"></div>
          </section>

          <section class="card">
            <h3 class="card__title"><span class="step badge">3</span> Image size</h3>
            <div id="sizes" class="sizes" role="group" aria-label="Image size"></div>
          </section>

          <section class="card">
            <h3 class="card__title"><span class="step badge">4</span> Colors</h3>
            <div class="stack">
              <div id="presets" class="presets" role="group" aria-label="Color sets"></div>
              <div class="grid-2">
                <div class="field">
                  <label class="label" for="cBgA">Background</label>
                  <input id="cBgA" type="color" />
                </div>
                <div class="field">
                  <label class="label" for="cBgB">Background 2</label>
                  <input id="cBgB" type="color" />
                </div>
                <div class="field">
                  <label class="label" for="cCard">Card</label>
                  <input id="cCard" type="color" />
                </div>
                <div class="field">
                  <label class="label" for="cText">Text</label>
                  <input id="cText" type="color" />
                </div>
              </div>
              <div class="field">
                <label class="label" for="opacity"><span>Card opacity</span><output id="o-opacity" for="opacity"></output></label>
                <input id="opacity" type="range" min="0" max="100" step="1" />
              </div>
              <div class="field">
                <label class="label" for="radius"><span>Corner radius</span><output id="o-radius" for="radius"></output></label>
                <input id="radius" type="range" min="0" max="120" step="1" />
              </div>
              <div class="field">
                <label class="label" for="margin"><span>Card margin</span><output id="o-margin" for="margin"></output></label>
                <input id="margin" type="range" min="0" max="16" step="1" />
              </div>
            </div>
          </section>

          <section class="card">
            <h3 class="card__title"><span class="step badge">5</span> Text style</h3>
            <div class="stack">
              <div class="field">
                <label class="label" for="fsize"><span>Font size</span><output id="o-fsize" for="fsize"></output></label>
                <input id="fsize" type="range" min="24" max="140" step="1" />
              </div>
              <p id="fitnote" class="hint" hidden>
                The text runs past the card. Lower the size or turn on auto-fit.
              </p>
              <label class="check"><input id="auto" type="checkbox" /> Auto-fit to card</label>
              <label class="check"><input id="mark" type="checkbox" /> Opening quote mark</label>
              <label class="check"><input id="frame" type="checkbox" /> Frame line</label>
              <div class="grid-2" role="group" aria-label="Text alignment">
                <button class="btn chip" type="button" data-align="left">Align left</button>
                <button class="btn chip" type="button" data-align="center">Align center</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
