<!doctype html>
<html lang="en-us">
  <head>
    <title>Countdown Timer &middot; mfgbhatti</title>
    <!-- Enable responsiveness on mobile devices-->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <link href="http://gmpg.org/xfn/11" rel="profile" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="http://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700|Abril+Fatface"
    />

    <!-- Icons -->
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="public/apple-touch-icon-144-precomposed.png"
    />
    <link rel="shortcut icon" href="public/favicon.ico" />
  </head>
  <body>
    <div class="content container">
      <div class="wrapper">
        <div class="container">
          <h1 class="neonText" id="days">0</h1>
          <span>Days</span>
        </div>
        <div class="container">
          <h1 class="neonText" id="hours">0</h1>
          <span>Hours</span>
        </div>
        <div class="container">
          <h1 class="neonText" id="minutes">0</h1>
          <span>Minutes</span>
        </div>
        <div class="container">
          <h1 class="neonText" id="seconds">0</h1>
          <span>Seconds</span>
        </div>
      </div>
    </div>
    <!-- Page-specific JS -->
    <script src="script.js"></script>
  </body>
</html>
