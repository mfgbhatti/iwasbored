<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer &middot; mfgbhatti</title>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../assets/js/theme.js"></script>
    <!-- Icons -->
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="../assets/img/apple-touch-icon-144-precomposed.png"
    />
    <link rel="shortcut icon" href="../assets/img/favicon.ico" />
  </head>
  <body>
    <main class="page">
      <div class="site-bar">
        <a class="back" href="../">&larr; projects</a>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <header class="page-head">
        <h1>countdown timer</h1>
        <p>days, hours, minutes and seconds to go.</p>
      </header>
      <div class="units">
        <div class="card unit">
          <div class="unit__value num" id="days">0</div>
          <span class="unit__label">Days</span>
        </div>
        <div class="card unit">
          <div class="unit__value num" id="hours">0</div>
          <span class="unit__label">Hours</span>
        </div>
        <div class="card unit">
          <div class="unit__value num" id="minutes">0</div>
          <span class="unit__label">Minutes</span>
        </div>
        <div class="card unit">
          <div class="unit__value num" id="seconds">0</div>
          <span class="unit__label">Seconds</span>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
